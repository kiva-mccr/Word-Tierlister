# Test on macOS (T-18): no Mac at hand, so GitHub's Macs run the program for us, on Apple Silicon (macos-latest) and
# on Intel (macos-15-intel; macos-13 was retired by GitHub in late 2025). Each one:
#   - runs every self-test (tests/run_tests.sh with KEEP_GOING=1: all failures listed, not just the first); a Mac
#     runner has a real screen, so the window tests run as they would on a desktop (no xvfb)
#   - saves the smoke test's screenshot of each stage (SMOKE_SHOTS, Pillow's ImageGrab)
#   - builds the program (in _selftest_build: the app bundle, started once) and photographs its first window
# The tests are split over several machines per Mac, run at the same time (SHARD=k/n, tests/_shard.py): 2 for Apple
# Silicon, 3 for the slower Intel Mac, 5 in all (a free account runs at most 5 macOS jobs at once). The pictures and
# the built app are downloads of the run (Actions > Test on macOS > the run > Artifacts). Started by hand (Run
# workflow), by a pull request that touches the code, and by a push to main; a newer push to a pull request cancels
# its older run.
name: Test on macOS

on:
  workflow_dispatch:
  pull_request:
    paths: ["**.py", "src/**", "tests/**", "requirements.txt", ".github/workflows/macos.yml", "!**.md"]
  push:
    branches: [main]
    paths: ["**.py", "src/**", "tests/**", "requirements.txt", ".github/workflows/macos.yml", "!**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:                    # (Apple Silicon: the release's program is built there; Intel: no release
          - {os: macos-latest, name: apple-silicon, shard: 1/2}          #  program yet, but the source should run)
          - {os: macos-latest, name: apple-silicon, shard: 2/2}
          - {os: macos-15-intel, name: intel, shard: 1/3}
          - {os: macos-15-intel, name: intel, shard: 2/3}
          - {os: macos-15-intel, name: intel, shard: 3/3}
    name: macos (${{ matrix.name }}, part ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1    # (brew would update itself before installing displayplacer)
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages (and Pillow for the screenshots), and WordNet as on a desktop that has looked up a definition
        run: |
          python -m pip install -r requirements.txt pillow pyinstaller
          python -m nltk.downloader -q wordnet
      - name: The machine
        run: |
          sw_vers; uname -m
          python -c "import sys, tkinter; print(sys.version); r = tkinter.Tk(); print('Tk', tkinter.TkVersion, r.tk.call('tk', 'windowingsystem'), 'screen', r.winfo_screenwidth(), 'x', r.winfo_screenheight(), 'at', r.winfo_fpixels('1i'), 'dpi')"
          python -c "import sys; sys.path.insert(0, 'src'); import tkinter, fonts; r = tkinter.Tk(); print('typefaces', fonts.load_typefaces(), fonts.init_fonts(r), fonts.font('word').actual(), sorted(f for f in tkinter.font.families(r) if 'Young' in f or 'Atkinson' in f))"
          system_profiler SPDisplaysDataType | grep -i -E "resolution|looks like" || true
          mkdir -p "$RUNNER_TEMP/shots/smoke" "$RUNNER_TEMP/shots/program"
          echo "part=$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_ENV"
      - name: A screen like the tests' own (1600 x 1200 or else 1920 x 1080; the runner starts at 1024 x 768)
        run: |
          brew install -q jakehilborn/jakehilborn/displayplacer > /dev/null
          id=$(displayplacer list | sed -n 's/^Persistent screen id: //p' | head -1)
          res=1920x1080
          if displayplacer list | grep -q "res:1600x1200 "; then res=1600x1200; fi
          displayplacer "id:$id res:$res hz:60 color_depth:7 scaling:off origin:(0,0) degree:0" || true
          sleep 2
          python -c "import tkinter; r = tkinter.Tk(); print('screen now', r.winfo_screenwidth(), 'x', r.winfo_screenheight())"
      - name: Self-tests (this part; the build test keeps its program in dist/)
        run: |
          SHARD=${{ matrix.shard }} KEEP_GOING=1 TEST_TIMEOUT=300 PY=python SMOKE_SHOTS="$RUNNER_TEMP/shots/smoke" \
            BUILD_DIST="$GITHUB_WORKSPACE/dist" sh tests/run_tests.sh
      - name: Photograph the built program's first window
        if: ${{ !cancelled() && hashFiles('dist/Word Tierlister.app/Contents/Info.plist') != '' }}
        continue-on-error: true
        run: |
          home=$(mktemp -d)
          mkdir -p "$home/Programs"
          cp -R "dist/Word Tierlister.app" "$home/Programs/"
          printf 'alpha\nbeta\ngamma\ndelta\nepsilon\nzeta\n' > "$home/words.txt"
          HOME="$home" WORD_TIERLISTER_OFFLINE=1 \
            "$home/Programs/Word Tierlister.app/Contents/MacOS/Word Tierlister" \
            --wordlist "$home/words.txt" --no-install --console > "$home/out.txt" 2>&1 &
          pid=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/shots/program/first-window.png"
          kill $pid 2>/dev/null || true
          cat "$home/out.txt"
      - name: Zip the built app
        if: ${{ !cancelled() && hashFiles('dist/Word Tierlister.app/Contents/Info.plist') != '' }}
        run: ditto -c -k --keepParent "dist/Word Tierlister.app" "$RUNNER_TEMP/word-tierlister-macos-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.name }}-${{ env.part }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: word-tierlister-macos-${{ matrix.name }}
          path: ${{ runner.temp }}/word-tierlister-macos-${{ matrix.name }}.zip
          if-no-files-found: ignore
          retention-days: 7
