# Build programs (T-8): Word Tierlister as a program for Linux, Windows and macOS, built at the same time on GitHub's
# machines from the pushed source (PyInstaller builds only for the system it runs on).
#   - "Run workflow" on the Actions tab, or `python tools/build.py --all`: the three programs as downloads of the run
#   - "Run workflow" on main with "Publish as a release" ticked (T-17), or pushing a tag v<VERSION> (src/constants.py):
#     the same, published as the GitHub Release v<VERSION> (the README links there); the button makes the tag itself
# The release's page starts with .github/release-notes.md (T-5: what an unsigned program asks). Each build is started
# once to check that it runs (tools/build.py --check). macOS (T-16): an app bundle for Apple Silicon (macos-latest),
# zipped as word-tierlister-macos.zip; Intel Macs are not built for.
name: Build programs

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release (v + VERSION from src/constants.py; from main only)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # (an older Linux: the program then runs on newer ones too)
            built: dist/word-tierlister
            asset: word-tierlister-linux
          - os: windows-latest
            built: dist/word-tierlister.exe
            asset: word-tierlister-windows.exe
          - os: macos-latest              # (Apple Silicon)
            built: dist/Word Tierlister.app
            asset: word-tierlister-macos.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30                # (a stuck build or check fails instead of running for hours)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import constants; print(constants.VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match VERSION $version in src/constants.py"; exit 1
          fi
      - name: A display for the check (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build and check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build.py --check
      - name: Build and check (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/build.py --check
      - name: Name it for the release
        if: runner.os != 'macOS'
        shell: bash
        run: mkdir -p out && cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
      - name: Zip the app for the release (macOS)
        if: runner.os == 'macOS'
        run: mkdir -p out && ditto -c -k --keepParent "${{ matrix.built }}" "out/${{ matrix.asset }}"   # (keeps its links and signature)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4              # (for the release notes)
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Copies under the old names (1.0.2 and older look for them to update; standalone.OLD_RELEASE_ASSETS)
        run: |
          cp assets/word-tierlister-linux assets/word-tierlist-linux
          cp assets/word-tierlister-windows.exe assets/word-tierlist-windows.exe
          cp assets/word-tierlister-macos.zip assets/word-tierlist-macos.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else                                   # (the button: the tag is v + VERSION, made here on this commit)
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "A release is published from main only (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            tag="v$(python3 -c "import sys; sys.path.insert(0, 'src'); import constants; print(constants.VERSION)")"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag is already released: raise VERSION in src/constants.py first"; exit 1
            fi
          fi
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Word Tierlister $tag" --notes-file .github/release-notes.md --generate-notes
