# Test on Linux and Windows (T-20): every self-test on GitHub's Linux and Windows machines, as the macOS workflow
# does on its Macs. Linux runs the window tests under xvfb with openbox (as here); Windows has a real desktop, so they
# run as they would on a PC. The tests are split over several machines run at once (SHARD=k/n, tests/_shard.py):
# 2 for Linux, 3 for Windows (slower). The build test makes and starts the program there too (PyInstaller). The smoke
# test's screenshots are downloads of the run (Actions > Test on Linux and Windows > the run > Artifacts). Started by
# hand (Run workflow), by a pull request that touches the code, and by a push to main; a newer push to a pull request
# cancels its older run. A quick check runs first (about a minute: check_release's static checks, stale notes beside
# the code, the layering, pyflakes over src and tools), so a slip of that kind shows long before the window tests end.
name: Test on Linux and Windows

on:
  workflow_dispatch:
  pull_request:
    paths: ["**.py", "src/**", "tests/**", "requirements.txt", ".github/workflows/tests.yml", "!**.md"]
  push:
    branches: [main]
    paths: ["**.py", "src/**", "tests/**", "requirements.txt", ".github/workflows/tests.yml", "!**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: quick check (notes, layers, pyflakes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pyflakes
        run: python -m pip install -q pyflakes && python -m pyflakes src tools
      - name: Release checks (no tests)
        run: python tools/check_release.py

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux, shard: 1/2}
          - {os: ubuntu-latest, name: linux, shard: 2/2}
          - {os: windows-latest, name: windows, shard: 1/3}
          - {os: windows-latest, name: windows, shard: 2/3}
          - {os: windows-latest, name: windows, shard: 3/3}
    name: ${{ matrix.name }} (part ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash              # (Git Bash on Windows: run_tests.sh is a sh script)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A display and a window manager for the window tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb openbox xdotool
      - name: A 1920 x 1080 screen (Windows; the runner starts at 1024 x 768, too small for the zoom tests)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Packages (and Pillow for the screenshots, PyInstaller for the build test)
        run: python -m pip install -r requirements.txt pillow pyinstaller
      - name: The machine
        run: |
          x=; [ "$RUNNER_OS" = Linux ] && x="xvfb-run -a"            # (Linux has no screen of its own)
          $x python -c "import sys, tkinter; r = tkinter.Tk(); print(sys.version, 'Tk', tkinter.TkVersion, 'screen', r.winfo_screenwidth(), 'x', r.winfo_screenheight(), 'at', r.winfo_fpixels('1i'), 'dpi')"
          mkdir -p "$RUNNER_TEMP/shots"
          echo "part=$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_ENV"
      - name: Self-tests (this part)
        run: SHARD=${{ matrix.shard }} KEEP_GOING=1 TEST_TIMEOUT=300 PY=python SMOKE_SHOTS="$RUNNER_TEMP/shots" sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.name }}-${{ env.part }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
