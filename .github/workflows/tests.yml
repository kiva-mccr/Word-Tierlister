# Test on Linux and Windows (T-20): every self-test on GitHub's Linux and Windows machines, as the macOS workflow
# does on its Macs. Linux runs the window tests under xvfb with openbox (as here); Windows has a real desktop, so they
# run as they would on a PC. The tests are split over several machines run at once (SHARD=k/n, tests/_shard.py):
# 2 for Linux, 3 for Windows (slower). The build test makes and starts the program there too (PyInstaller). The smoke
# test's screenshots are downloads of the run (Actions > Test on Linux and Windows > the run > Artifacts). Started by
# hand (Run workflow), by a pull request that touches the code, and by a push to main; a newer push to a pull request
# cancels its older run.
name: Test on Linux and Windows

on:
  workflow_dispatch:
  pull_request:
    paths: ["**.py", "src/**", "tests/**", "requirements.txt", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["**.py", "src/**", "tests/**", "requirements.txt", ".github/workflows/tests.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux, shard: 1/2}
          - {os: ubuntu-latest, name: linux, shard: 2/2}
          - {os: windows-latest, name: windows, shard: 1/3}
          - {os: windows-latest, name: windows, shard: 2/3}
          - {os: windows-latest, name: windows, shard: 3/3}
    name: ${{ matrix.name }} (part ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash              # (Git Bash on Windows: run_tests.sh is a sh script)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A display and a window manager for the window tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb openbox xdotool
      - name: Packages (and Pillow for the screenshots, PyInstaller for the build test)
        run: python -m pip install -r requirements.txt pillow pyinstaller
      - name: The machine
        run: |
          python -c "import sys, tkinter; print(sys.version, 'Tk', tkinter.TkVersion)"
          mkdir -p "$RUNNER_TEMP/shots"
          echo "part=$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_ENV"
      - name: Self-tests (this part)
        run: SHARD=${{ matrix.shard }} KEEP_GOING=1 TEST_TIMEOUT=300 PY=python SMOKE_SHOTS="$RUNNER_TEMP/shots" sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.name }}-${{ env.part }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
